name: Postgres backup (pg_dump)

on:
  schedule:
    - cron: '0 3 * * 0'  # domingo 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres-client-17
        run: |
          set -eo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -eo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M)
          OUT="basketfemdb-${STAMP}.sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --clean --if-exists --no-owner --no-privileges \
            --exclude-schema='auth' --exclude-schema='storage' --exclude-schema='realtime' \
            --exclude-schema='supabase_functions' --exclude-schema='vault' --exclude-schema='pgsodium' --exclude-schema='pgsodium_masks' \
            --exclude-schema='graphql' --exclude-schema='graphql_public' --exclude-schema='extensions' --exclude-schema='net' \
            | gzip -9 > "$OUT"
          ls -lh "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 90
          compression-level: 0  # ya está gzip
