name: Actualizar resultados FIBA U20

on:
  schedule:
    # Minutos "raros" a propósito: GitHub salta ejecuciones en intervalos
    # populares como */15 o minuto 0. Franja 11:00-21:00 UTC en julio.
    - cron: "7,22,37,52 11-21 * 7 *"
  workflow_dispatch: {}  # permite lanzarlo a mano desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar script
        env:
          SUPABASE_URL: https://qvtxqckuolacvnvrvysu.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/actualizar_resultados.py